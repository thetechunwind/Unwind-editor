[package]
name = "tech_unwind"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
symphonia = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "0.4"
rodio = { version = "0.19", default-features = false }
rfd = { version = "0.13", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
opt-level = 3
lto = "thin"
